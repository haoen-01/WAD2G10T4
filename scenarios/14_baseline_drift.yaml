# One case, refreshed as the decline continues -- not one per day it persists.
# This used to read 16, which was the duplicate-case defect written down as an
# expectation: eighteen declining days produced sixteen near-identical cards for the
# same person, and `metrics.open_cases` counted days rather than people.
