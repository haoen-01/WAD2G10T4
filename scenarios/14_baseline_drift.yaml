# M24 additive latent world. Eighteen unbroken low days at roughly 44% of her own norm. The
# authored world never "absorbs" the decline the way a rolling median does -- `days_low` simply
# keeps counting -- which is the independent statement this scenario always needed and could not
# make while the only account of the truth was the one the baseline computed.
