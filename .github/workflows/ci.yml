name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-attribution:
    # Every commit must carry a teammate's identity, never Claude's (CONTRIBUTING.md).
    # Unlike the local commit-msg hook, this cannot be skipped with --no-verify.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject Claude-authored or co-authored commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          bash scripts/check-commit-attribution.sh --range "$range"
  verify:
    runs-on: ubuntu-latest
    # The API suite alone takes several minutes on a hosted runner, and the browser suite and the
    # production build follow it; 15 minutes cancelled main before the build step was reached.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # client/ and e2e/ are separate installs, each with its own lockfile.
          cache-dependency-path: |
            client/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
          enable-cache: true
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: uv sync --frozen
        working-directory: server
      - run: pnpm format:check
      - run: pnpm client:check
      - run: pnpm lint
      - run: pnpm typecheck
      # `pnpm test` runs the API suite, the web unit tests and the browser suite one after another,
      # each even if an earlier one failed, so a failing API test still leaves Playwright results.
      # Run concurrently, the CPU-bound API suite starves the browser suite's dev server, API and
      # Chromium on a small runner, and e2e tests fail on timing (swallowed clicks, closed browser
      # sessions, dropped API sockets) rather than on behaviour.
      - run: pnpm test
      # A failing browser test is only diagnosable from its trace, screenshot and video.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: playwright-results
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - run: pnpm test:scenarios
      - run: pnpm build
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: silverloop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d silverloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SILVERLOOP_POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/silverloop_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      # The root package.json is a dependency-free script runner, so this job installs only the
      # API; `pnpm test:postgres` runs pytest in server/ (through `node scripts/run.mjs`).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
      - run: uv sync --frozen
        working-directory: server
      - run: pnpm test:postgres
