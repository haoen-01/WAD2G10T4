version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      javascript-client:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /e2e
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      javascript-e2e:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /server
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python-api:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly